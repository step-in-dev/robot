name: CI and release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # setup-python does not publish 3.7 for Ubuntu 24.04 (ubuntu-latest).
          - python-version: "3.7"
            runner: ubuntu-22.04
          - python-version: "3.9"
            runner: ubuntu-latest
          - python-version: "3.12"
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

  release:
    needs: test
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Copy LICENSE into package directory
        run: cp LICENSE robot/LICENSE

      - name: Build distribution zip
        run: zip -r "robot-${{ github.ref_name }}.zip" robot sample_solution.py viewer -x '*__pycache__*'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: robot-${{ github.ref_name }}.zip
          generate_release_notes: false
