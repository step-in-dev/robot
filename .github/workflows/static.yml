# Deploy static site to GitHub Pages (HTML catalog generated in CI).
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - ".github/workflows/static.yml"
      - "robot/tasks/**"
      - "robot/task_catalog.py"
      - "robot/loader.py"
      - "robot/command_help.py"
      - "robot/gui_constraints.py"
      - "robot/i18n.py"
      - "robot/locales/en.json"
      - "robot/locales/ru.json"
      - "tools/build_website_content.py"
      - "tools/article_builder.py"
      - "articles/**"
      - "requirements-build.txt"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Generate website content
        run: python tools/build_website_content.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./website"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
